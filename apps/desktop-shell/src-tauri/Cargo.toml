[package]
name = "approvaliq"
version = "0.1.0"
description = "ApprovalIQ Desktop Shell"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "approvaliq_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.3", features = [] }
